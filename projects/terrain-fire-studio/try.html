<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terrain Fire Studio — try</title>
    <style>
      :root {
        --ink: #2c2a26;
        --ember: #c45c26;
        --ridge: #3d5a45;
        --sand: #e8dfd0;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #1a1814, #2c2a26 45%, #3d3428);
        color: #f3ebe0;
        min-height: 100vh;
        padding: 2rem;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        background: color-mix(in srgb, var(--sand) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--ember) 40%, transparent);
        border-radius: 0.75rem;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        color: var(--ember);
        font-size: 1.75rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        opacity: 0.9;
      }
      input,
      select {
        width: 100%;
        margin-top: 0.25rem;
        padding: 0.45rem 0.55rem;
        border-radius: 0.4rem;
        border: 1px solid #6b6358;
        background: #1a1814;
        color: #f3ebe0;
        box-sizing: border-box;
      }
      button {
        margin-top: 1rem;
        background: var(--ember);
        color: white;
        border: 0;
        border-radius: 0.4rem;
        padding: 0.55rem 1rem;
        cursor: pointer;
        font-weight: 600;
      }
      .scores {
        margin-top: 1.25rem;
        display: grid;
        gap: 0.75rem;
      }
      .bar {
        height: 0.55rem;
        background: #3a342c;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--ember);
      }
      .bar.naive > span {
        background: var(--ridge);
      }
      .note {
        margin-top: 1rem;
        font-size: 0.8rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Terrain Fire Studio</h1>
      <p>Offline soft-sim: physics-aware refresh vs naive overlay.</p>
      <label
        >Photo resolution (cm)
        <input id="res" type="number" value="22" min="8" max="80"
      /></label>
      <label
        >Cloud cover (0–1)
        <input id="cloud" type="number" step="0.01" value="0.12" min="0" max="1"
      /></label>
      <label
        >Elevation change (m)
        <input id="elev" type="number" value="8" min="0" max="40"
      /></label>
      <label
        >Slope steepness (0–1)
        <input id="slope" type="number" step="0.01" value="0.45" min="0" max="1"
      /></label>
      <label
        >Control density (0–1)
        <input id="ctrl" type="number" step="0.01" value="0.7" min="0" max="1"
      /></label>
      <label
        >Seam budget (m)
        <input id="seam" type="number" step="0.1" value="4.5" min="0.5" max="20"
      /></label>
      <button type="button" id="run">Score A vs B</button>
      <div class="scores" id="out"></div>
      <p class="note">
        Soft-sim only — not LTM, not live dispatch, not survey certification.
        Paper: arXiv 2607.08711v1
      </p>
    </main>
    <script>
      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function resQ(cm) {
        return clamp(1 - (cm - 10) / 90, 0, 1);
      }
      function scorePhysics(input) {
        const pressure = clamp(input.elev / input.seam, 0, 2);
        const rq = resQ(input.res);
        const elev =
          (input.prior * 50 + input.ctrl * 30 - pressure * 12) * 1.12 +
          8 -
          input.slope * 6;
        const slope =
          (1 - input.slope) * 55 * 1.12 + input.prior * 25 + 10 - input.fuel * 12;
        const seam =
          (1 - Math.min(1, pressure)) * 70 * 1.12 + input.ctrl * 18 + 8;
        const fuel =
          (rq * 55 + input.overlap * 25 - input.cloud * 18) * 1.12 * 0.55 +
          (1 - input.fuel) * 35 +
          6;
        const photo =
          (rq * 55 + input.overlap * 25 - input.cloud * 18) * 1.12 + 5;
        const physics =
          clamp(elev, 0, 100) * 0.28 +
          clamp(slope, 0, 100) * 0.24 +
          clamp(seam, 0, 100) * 0.22 +
          clamp(fuel, 0, 100) * 0.14 +
          clamp(photo, 0, 100) * 0.12;
        const overlay =
          clamp(photo, 0, 100) * 0.55 +
          clamp(fuel, 0, 100) * 0.25 +
          (1 - input.slope) * 20 -
          pressure * 15;
        return round2(clamp(physics * 0.78 + overlay * 0.22 + 4, 0, 100));
      }
      function scoreNaive(input) {
        const pressure = clamp(input.elev / input.seam, 0, 2);
        const rq = resQ(input.res);
        const elev =
          rq * 40 * 1.08 + 12 - input.elev * 1.8 - input.slope * 28;
        const photo =
          rq * 50 * 1.08 + input.overlap * 30 - input.cloud * 25 + 8;
        const fuel =
          rq * 45 * 1.08 + (1 - input.fuel) * 30 - input.cloud * 22 + 5;
        const physics =
          (clamp(elev, 0, 100) +
            clamp((1 - input.slope) * 35 * 1.08 + rq * 20 - pressure * 18, 0, 100) +
            clamp(
              (1 - Math.min(1, pressure)) * 40 * 1.08 + input.overlap * 20,
              0,
              100,
            ) +
            clamp(fuel, 0, 100) +
            clamp(photo, 0, 100)) /
          5;
        const overlay =
          clamp(photo, 0, 100) * 0.5 +
          clamp(fuel, 0, 100) * 0.3 +
          rq * 20 -
          pressure * 10;
        return round2(
          clamp(
            overlay * 0.72 + physics * 0.28 - input.slope * 8 - pressure * 6,
            0,
            100,
          ),
        );
      }
      function bar(label, value, cls) {
        return (
          "<div><div>" +
          label +
          ": <strong>" +
          value +
          "</strong></div><div class='bar " +
          cls +
          "'><span style='width:" +
          value +
          "%'></span></div></div>"
        );
      }
      document.getElementById("run").onclick = function () {
        const input = {
          res: Number(document.getElementById("res").value),
          cloud: Number(document.getElementById("cloud").value),
          elev: Number(document.getElementById("elev").value),
          slope: Number(document.getElementById("slope").value),
          ctrl: Number(document.getElementById("ctrl").value),
          seam: Number(document.getElementById("seam").value),
          prior: 0.74,
          fuel: 0.22,
          overlap: 0.72,
        };
        const a = scorePhysics(input);
        const b = scoreNaive(input);
        const winner =
          a > b + 0.5 ? "physics_aware" : b > a + 0.5 ? "naive_overlay" : "tie";
        document.getElementById("out").innerHTML =
          bar("A Physics-aware", a, "") +
          bar("B Naive overlay", b, "naive") +
          "<p>Winner: <strong>" +
          winner +
          "</strong></p>";
      };
    </script>
  </body>
</html>
