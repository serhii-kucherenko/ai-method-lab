<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PBPK Structure Studio — offline try</title>
    <style>
      :root {
        --ink: #152028;
        --teal: #2f7a72;
        --porcelain: #eef2f3;
        --amber: #c4923a;
        --line: #c4cbd0;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--porcelain);
        color: var(--ink);
      }
      header {
        background: linear-gradient(165deg, #0d1418, #152028 48%, #1a2e2c);
        color: var(--porcelain);
        padding: 2.5rem 1.5rem 3rem;
      }
      h1 {
        font-family: Manrope, system-ui, sans-serif;
        font-size: 2rem;
        color: var(--teal);
        margin: 0 0 0.5rem;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
      }
      button {
        margin-top: 1rem;
        background: var(--teal);
        color: #fff;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.6rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .out {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      .note {
        font-size: 0.85rem;
        color: #4a5560;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PBPK Structure Studio</h1>
      <p>Offline soft-sim: structure-only topology PBPK vs measured-lab.</p>
    </header>
    <main>
      <label
        >Structure coverage
        <input id="sc" type="number" min="0" max="1" step="0.01" value="0.65"
      /></label>
      <label
        >Topology fidelity
        <input id="tf" type="number" min="0" max="1" step="0.01" value="0.7"
      /></label>
      <label
        >ADME clarity
        <input id="ac" type="number" min="0" max="1" step="0.01" value="0.72"
      /></label>
      <label
        >Lab pass rate
        <input id="lp" type="number" min="0" max="1" step="0.01" value="0.8"
      /></label>
      <button id="go">Score A/B</button>
      <div class="out" id="out">Run a soft-sim compare.</div>
      <p class="note">
        Soft-sim only; not regulatory filing; not live LIMS; not authors’
        system / not Sisyphus brand. ChemRxiv 10.26434/chemrxiv.15004452.
      </p>
    </main>
    <script>
      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function scoreStructure(i) {
        const load = clamp(i.hard * (1.25 - i.sc * 0.5), 0, 1.5);
        const str = clamp(
          (i.sc * 55 + i.tf * 25 - load * 10) * 1.12 + 8 - i.risk * 6,
          0,
          100,
        );
        const top = clamp(i.tf * 60 * 1.12 + i.sc * 25 + 8 - i.opt * 4, 0, 100);
        const adme = clamp(
          i.ac * 58 * 1.12 + i.sc * 28 + 10 - load * 12 - i.risk * 10,
          0,
          100,
        );
        const compile = clamp(
          i.stab * 50 * 1.12 + i.tf * 25 + i.sc * 15 + 8,
          0,
          100,
        );
        const only = clamp(
          str * 0.26 + top * 0.24 + adme * 0.28 + compile * 0.22,
          0,
          100,
        );
        const lab = clamp(i.lp * 55 * 1.12 + i.opt * 20 - i.hard * 18 - 6, 0, 100);
        const based = clamp(lab * 0.7 + i.lp * 20 + i.opt * 10 - load * 12, 0, 100);
        return round2(only * 0.82 + based * 0.18 + 4);
      }
      function scoreLab(i) {
        const load = clamp(i.hard * (1.25 - i.sc * 0.5), 0, 1.5);
        const lab = clamp(
          i.lp * 58 * 1.08 * 1.35 + i.opt * 32 - i.hard * 10 + 8,
          0,
          100,
        );
        const based = clamp(lab * 0.55 + i.opt * 30 + i.lp * 20 - load * 8, 0, 100);
        const only = clamp(lab * 0.2 + based * 0.2, 0, 100);
        return round2(based * 0.78 + only * 0.22 - i.hard * 8 - i.risk * 6);
      }
      document.getElementById("go").onclick = () => {
        const i = {
          sc: Number(document.getElementById("sc").value),
          tf: Number(document.getElementById("tf").value),
          ac: Number(document.getElementById("ac").value),
          lp: Number(document.getElementById("lp").value),
          stab: 0.68,
          opt: 0.55,
          hard: 0.35,
          risk: 0.25,
        };
        const a = scoreStructure(i);
        const b = scoreLab(i);
        const winner =
          a > b + 0.5 ? "structure_only" : b > a + 0.5 ? "measured_lab" : "tie";
        document.getElementById("out").textContent =
          "A structure-only " +
          a +
          " · B measured-lab " +
          b +
          " · winner " +
          winner +
          " · gap " +
          round2(Math.abs(a - b));
      };
    </script>
  </body>
</html>
