<!doctype html>
<meta charset="utf-8" />
<title>Tool Scope Studio</title>
<style>
  body { font: 16px Manrope, system-ui; background: #14080c; color: #e2e8f0; max-width: 720px; margin: 10vh auto; }
  button { background: #fb7185; border: 0; padding: 12px 16px; color: #14080c; font-weight: 600; cursor: pointer; }
  strong { color: #fb7185; }
</style>
<h1>Tool Scope Studio</h1>
<p>Grant only the tools the agent was scoped for.</p>
<button onclick="run()">Compare paths</button>
<p id="result"></p>
<script>
function run() {
  result.innerHTML =
    "<strong>Scope-bound A: 33% granted</strong> — shell and network denied.<br>" +
    "Open-tools B: 100% granted — scopes ignored.";
}
</script>
