<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assay Guard Studio — try</title>
    <style>
      :root {
        --ink: #1b242c;
        --aqua: #2a8f9a;
        --amber: #c48a2a;
        --white: #f2f5f7;
        --line: #c5ced3;
      }
      body {
        margin: 0;
        font-family: Manrope, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--white);
      }
      header {
        background: linear-gradient(165deg, #10161c, #1b242c 55%, #2a4550);
        color: #fff;
        padding: 3rem 1.5rem 2.5rem;
      }
      h1 {
        font-family: Sora, "Segoe UI", sans-serif;
        font-size: 2.4rem;
        margin: 0;
        color: var(--aqua);
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      input[type="range"] {
        width: 100%;
      }
      .bar {
        height: 0.5rem;
        background: #dfe4ea;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 0.35rem;
      }
      .fill {
        height: 100%;
        background: var(--aqua);
        width: 0%;
      }
      .fill.b {
        background: var(--amber);
      }
      .card {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-top: 1.25rem;
      }
      .note {
        font-size: 0.85rem;
        color: #4a5560;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Assay Guard Studio</h1>
      <p>Offline soft-sim: assay-aware vs naive protocol runner.</p>
    </header>
    <main>
      <label>
        Deck coverage
        <input id="deck" type="range" min="0" max="100" value="60" />
      </label>
      <label>
        Assay fidelity
        <input id="assay" type="range" min="0" max="100" value="70" />
      </label>
      <label>
        Protocol integrity
        <input id="integrity" type="range" min="0" max="100" value="65" />
      </label>
      <label>
        Naive pass / skip optimism
        <input id="naive" type="range" min="0" max="100" value="75" />
      </label>
      <div class="card">
        <div>Assay-aware (A): <strong id="aScore">—</strong></div>
        <div class="bar"><div class="fill" id="aBar"></div></div>
        <div style="margin-top: 0.75rem">
          Naive runner (B): <strong id="bScore">—</strong>
        </div>
        <div class="bar"><div class="fill b" id="bBar"></div></div>
        <p id="winner" style="margin-top: 0.75rem"></p>
      </div>
      <p class="note">
        Soft-sim only — not certified compliance, not live robot control, not
        the authors’ system (arXiv 2607.15620).
      </p>
    </main>
    <script>
      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function scoreA(d, a, p, n) {
        const load = n * 0.4;
        return round2(
          clamp(d * 40 + a * 35 + p * 30 - load * 18 + 8, 0, 100),
        );
      }
      function scoreB(d, a, p, n) {
        return round2(
          clamp(n * 55 + (1 - a) * 20 + (1 - p) * 15 - d * 8, 0, 100),
        );
      }
      function refresh() {
        const d = Number(deck.value) / 100;
        const a = Number(assay.value) / 100;
        const p = Number(integrity.value) / 100;
        const n = Number(naive.value) / 100;
        const A = scoreA(d, a, p, n);
        const B = scoreB(d, a, p, n);
        aScore.textContent = A;
        bScore.textContent = B;
        aBar.style.width = A + "%";
        bBar.style.width = B + "%";
        winner.textContent =
          A > B + 0.5
            ? "Winner: assay_aware"
            : B > A + 0.5
              ? "Winner: naive_protocol_runner"
              : "Winner: tie";
      }
      ["deck", "assay", "integrity", "naive"].forEach((id) => {
        document.getElementById(id).addEventListener("input", refresh);
      });
      refresh();
    </script>
  </body>
</html>
