<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commitment Coverage Studio — offline dual claim</title>
    <style>
      :root {
        --ink: #1e293b;
        --paper: #f1f5f9;
        --accent: #0d9488;
        --gap: #b45309;
        --rule: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.55 "Source Sans 3", system-ui, sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, #e8eef4 0%, var(--paper) 40%, #e2e8f0 100%);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 10vh 1.5rem 4rem;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: 1.85rem;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      .fence {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      p { margin: 0 0 1rem; color: #475569; }
      button {
        background: var(--accent);
        color: #f8fafc;
        border: 0;
        padding: 0.75rem 1.1rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover { filter: brightness(0.95); }
      #result {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid color-mix(in srgb, var(--rule) 50%, transparent);
        min-height: 4rem;
      }
      .a { color: var(--accent); font-weight: 600; }
      .b { color: var(--gap); font-weight: 600; }
      .meta { font-size: 0.85rem; color: #64748b; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="fence">Soft-sim · not live billing</p>
      <h1>Commitment Coverage Studio</h1>
      <p>
        Offline digest of the dual claim: commit-matched coverage (A) versus
        on-demand-blind (B). Sample dollars only — soft-sim lab fence.
      </p>
      <button type="button" onclick="run()">Compare A vs B</button>
      <div id="result" aria-live="polite"></div>
      <p class="meta">
        Open the live app for imports, gaps, and renewal packs. This page stays
        offline on purpose.
      </p>
    </main>
    <script>
      function run() {
        document.getElementById("result").innerHTML =
          '<p><span class="a">A · commit-matched:</span> $42k under-covered spill on matched locks — renewals see the dollar gap.</p>' +
          '<p><span class="b">B · on-demand-blind:</span> $0 attributed gap — blind path hides waste until the invoice lands.</p>' +
          "<p>Soft-sim sample only. Not a live cloud commitment console.</p>";
      }
    </script>
  </body>
</html>
