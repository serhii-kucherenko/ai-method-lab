<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feature Sufficiency Studio — offline try</title>
    <style>
      :root {
        --ink: #15202b;
        --teal: #1f8a7a;
        --sand: #f3efe6;
        --warn: #b85c38;
        --line: #c9d5cf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", sans-serif;
        background: var(--sand);
        color: var(--ink);
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        color: var(--teal);
        margin: 0 0 0.5rem;
      }
      .sub { color: #5a6660; max-width: 36rem; }
      .grid {
        display: grid;
        gap: 0.75rem;
        margin: 1.5rem 0;
        max-width: 28rem;
      }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
      input[type="range"] { width: 100%; }
      button {
        background: var(--teal);
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.65rem 1.1rem;
        cursor: pointer;
        font-weight: 600;
      }
      .out {
        margin-top: 1.25rem;
        padding: 1rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: #fffcf7;
        max-width: 28rem;
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--teal);
        margin: 0.35rem 0 0.75rem;
      }
      .bar.b { background: var(--warn); }
      footer { margin-top: 2rem; font-size: 0.85rem; color: #5a6660; max-width: 36rem; }
    </style>
  </head>
  <body>
    <h1>Feature Sufficiency Studio</h1>
    <p class="sub">
      Offline soft-sim: partial-observation sufficiency vs full-feature baseline.
      Know when partial data is enough — not clinical advice.
    </p>
    <div class="grid" id="inputs"></div>
    <button type="button" id="score">Score A/B</button>
    <div class="out" id="out"></div>
    <footer>
      Soft-sim only. Not clinical advice. Not FDA. Not FSA brand. Inspired by
      arXiv 2607.09165 — authors’ code none published.
    </footer>
    <script>
      const fields = [
        ["maskCoverage", 0.42],
        ["featureSalience", 0.7],
        ["cohortFit", 0.74],
        ["labelAgreement", 0.68],
        ["fullFeatureAccuracy", 0.82],
        ["imputationOptimism", 0.7],
        ["missingnessPressure", 0.55],
        ["leakageRisk", 0.28],
      ];
      const box = document.getElementById("inputs");
      const state = {};
      for (const [k, v] of fields) {
        state[k] = v;
        const lab = document.createElement("label");
        lab.innerHTML =
          k +
          ' <span data-v></span><input type="range" min="0" max="1" step="0.01" value="' +
          v +
          '" />';
        const span = lab.querySelector("[data-v]");
        const input = lab.querySelector("input");
        span.textContent = v.toFixed(2);
        input.addEventListener("input", () => {
          state[k] = Number(input.value);
          span.textContent = state[k].toFixed(2);
        });
        box.appendChild(lab);
      }

      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function overallPartial(s) {
        const load = clamp(s.missingnessPressure * (1.25 - s.maskCoverage * 0.5), 0, 1.5);
        const coverage = clamp(
          (s.maskCoverage * 55 + s.featureSalience * 25 - load * 10) * 1.12 + 8 - s.leakageRisk * 6,
          0,
          100,
        );
        const salience = clamp(
          s.featureSalience * 60 * 1.12 + s.maskCoverage * 25 + 8 - s.imputationOptimism * 4,
          0,
          100,
        );
        const reason = clamp(
          s.labelAgreement * 58 * 1.12 + s.maskCoverage * 28 + 10 - load * 12 - s.leakageRisk * 10,
          0,
          100,
        );
        const cohort = clamp(
          s.cohortFit * 50 * 1.12 + s.featureSalience * 25 + s.maskCoverage * 15 + 8,
          0,
          100,
        );
        const partial =
          coverage * 0.26 + salience * 0.24 + reason * 0.28 + cohort * 0.22;
        const full = clamp(
          s.fullFeatureAccuracy * 55 * 1.12 + s.imputationOptimism * 20 - s.missingnessPressure * 18 - 6,
          0,
          100,
        );
        const fullC = clamp(full * 0.7 + s.fullFeatureAccuracy * 20 + s.imputationOptimism * 10 - load * 12, 0, 100);
        return round2(clamp(partial * 0.82 + fullC * 0.18 + 4, 0, 100));
      }
      function overallFull(s) {
        const load = clamp(s.missingnessPressure * (1.25 - s.maskCoverage * 0.5), 0, 1.5);
        const full = clamp(
          s.fullFeatureAccuracy * 58 * 1.08 + s.imputationOptimism * 32 - s.missingnessPressure * 10 + 8,
          0,
          100,
        );
        const fullC = clamp(full * 0.55 + s.imputationOptimism * 30 + s.fullFeatureAccuracy * 20 - load * 8, 0, 100);
        const partialC = clamp(
          s.fullFeatureAccuracy * 35 + 10 - s.missingnessPressure * 22 - s.leakageRisk * 12,
          0,
          100,
        );
        return round2(
          clamp(fullC * 0.78 + partialC * 0.22 - s.missingnessPressure * 8 - s.leakageRisk * 6, 0, 100),
        );
      }

      function render() {
        const a = overallPartial(state);
        const b = overallFull(state);
        const gap = round2(Math.abs(a - b));
        let winner = "tie";
        if (a > b + 0.5) winner = "partial_observation";
        else if (b > a + 0.5) winner = "full_feature";
        document.getElementById("out").innerHTML =
          "<div>Partial observation (A): <strong>" +
          a +
          '</strong><div class="bar" style="width:' +
          a +
          '%"></div></div>' +
          "<div>Full-feature baseline (B): <strong>" +
          b +
          '</strong><div class="bar b" style="width:' +
          b +
          '%"></div></div>' +
          "<div>Winner: <strong>" +
          winner +
          "</strong> · gap " +
          gap +
          "</div>";
      }
      document.getElementById("score").addEventListener("click", render);
      render();
    </script>
  </body>
</html>
