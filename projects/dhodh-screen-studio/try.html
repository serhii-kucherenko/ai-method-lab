<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dhodh Screen Studio — try</title>
  <style>
    :root {
      --ink: #14181c;
      --teal: #1a5c66;
      --mist: #eef3f4;
      --amber: #a67a30;
      --line: #c5cbce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--mist);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: linear-gradient(165deg, #0a0d0f, #1a2426);
      color: #fff;
      padding: 2.5rem 1.5rem 2rem;
    }
    header h1 { margin: 0; font-size: 1.75rem; color: var(--amber); }
    header p { margin: 0.75rem 0 0; max-width: 36rem; color: var(--mist); }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem; }
    label { display: block; margin-top: 0.75rem; font-size: 0.85rem; }
    input, select, button {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      font: inherit;
    }
    button {
      margin-top: 1rem;
      background: var(--teal);
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .out {
      margin-top: 1.25rem;
      padding: 1rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }
    footer {
      max-width: 40rem;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      font-size: 0.8rem;
      color: #556065;
    }
  </style>
</head>
<body>
  <header>
    <h1>Dhodh Screen Studio</h1>
    <p>Dock the parasite enzyme. Compare the screen — offline soft-sim of structure_based_dhodh vs naive_library_baseline.</p>
  </header>
  <main>
    <label>Docking fit <input id="dock" type="number" min="0" max="1" step="0.01" value="0.55" /></label>
    <label>Library hit rate <input id="library" type="number" min="0" max="1" step="0.01" value="0.35" /></label>
    <label>Pharmacophore match <input id="pharm" type="number" min="0" max="1" step="0.01" value="0.7" /></label>
    <label>Parasite selectivity <input id="selectivity" type="number" min="0" max="1" step="0.01" value="0.45" /></label>
    <label>Assay readout <input id="readout" type="number" min="0" max="1" step="0.01" value="0.65" /></label>
    <label>Bias
      <select id="bias">
        <option value="balanced">balanced</option>
        <option value="structure_first">structure_first</option>
        <option value="library_first">library_first</option>
        <option value="assay_first">assay_first</option>
      </select>
    </label>
    <button type="button" id="run">Run dual compare</button>
    <div class="out" id="out">Results appear here.</div>
  </main>
  <footer>
    Soft-sim only — not wet-lab validated, not clinical antimalarial advice, not IND/NDA ready, not compound procurement. Not authors’ brand.
  </footer>
  <script>
    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
    function round2(n) { return Math.round(n * 100) / 100; }
    function biasWeight(bias, lane) {
      if (bias === "balanced") return 1;
      return bias === lane ? 1.35 : 0.55;
    }
    function screenBurden(library, pharm, over) {
      return clamp(library * 0.35 + (1 - pharm) * 0.25 + over * 0.4 - 0.06, 0, 1.5);
    }
    function scoreStructure(input) {
      const boost = 1.12;
      const wS = biasWeight(input.scoringBias, "structure_first");
      const wA = biasWeight(input.scoringBias, "assay_first");
      const wL = biasWeight(input.scoringBias, "library_first");
      const avgBias = (wS + wA + (2 - wL)) / 3;
      const burden = screenBurden(input.libraryHitRate, input.pharmacophoreMatch, input.overclaimRisk);
      const dockingScore = round2(clamp(
        (input.dockingFit * 35 + input.evidenceStrength * 25 + input.assayReadout * 30 + input.screenFollowThrough * 10 - burden * 5) * boost * avgBias + 8 - input.overclaimRisk * 6 - (input.scoringBias === "library_first" ? 12 : 0), 0, 100));
      const libraryScore = round2(clamp(input.libraryHitRate * 35 * 0.7 + input.parasiteSelectivity * 25 * wL + (1 - input.dockingFit) * 20 + 4 - input.overclaimRisk * 8, 0, 100));
      const pharmacophoreCoverage = round2(clamp(input.assayReadout * 40 * boost * wA + input.dockingFit * 30 + input.screenFollowThrough * 15 + 8 - (1 - input.pharmacophoreMatch) * 18 - (input.scoringBias === "library_first" ? 8 : 0), 0, 100));
      const screenEfficiency = round2(clamp(((1 - burden) * 40 + input.screenFollowThrough * 25 + input.parasiteSelectivity * 20) * boost * wA + 8 - input.overclaimRisk * 8, 0, 100));
      const selectivityGap = round2(clamp((input.scoringBias === "library_first" ? 40 : 18) * boost + (1 - input.parasiteSelectivity) * 28 + burden * 12 - input.dockingFit * 12 + (1 - input.screenFollowThrough) * 12, 0, 100));
      const structureContribution = round2(clamp(dockingScore * 0.32 + pharmacophoreCoverage * 0.28 + screenEfficiency * 0.22 + (100 - selectivityGap) * 0.18, 0, 100));
      const libraryContribution = round2(clamp(dockingScore * 0.35 + libraryScore * 0.35 + screenEfficiency * 0.2 + selectivityGap * 0.1 - input.dockingFit * 6, 0, 100));
      const overall = round2(clamp(structureContribution * 0.82 + libraryContribution * 0.18 + 4 - (input.scoringBias === "library_first" ? 3 : 0) - (1 - input.pharmacophoreMatch) * 4, 0, 100));
      return { mode: "structure_based_dhodh", overall, dockingScore, libraryScore };
    }
    function scoreLibrary(input) {
      const boost = 1.08;
      const wL = biasWeight(input.scoringBias, "library_first");
      const wA = biasWeight(input.scoringBias, "assay_first");
      const burden = screenBurden(input.libraryHitRate, input.pharmacophoreMatch, input.overclaimRisk);
      const dockingScore = round2(clamp((1 - input.libraryHitRate) * 28 * boost + (1 - input.parasiteSelectivity) * 22 * boost + (wL + wA) * 5 - input.dockingFit * 10 - input.overclaimRisk * 10 - (input.scoringBias === "structure_first" ? 8 : 0), 0, 100));
      const libraryScore = round2(clamp(input.libraryHitRate * 20 * boost + (1 - input.parasiteSelectivity) * 35 * boost * Math.max(wL, wA) + (1 - burden) * 15 + 8 - input.dockingFit * 8, 0, 100));
      const screenEfficiency = round2(clamp((1 - input.parasiteSelectivity) * 35 * boost * Math.max(wL, wA) + input.assayReadout * 25 + 8 - burden * 10, 0, 100));
      const structureContribution = round2(clamp(dockingScore * 0.2 + libraryScore * 0.2 + screenEfficiency * 0.2 + 40, 0, 100));
      const libraryContribution = round2(clamp(dockingScore * 0.45 + libraryScore * 0.35 + screenEfficiency * 0.2 - burden * 6, 0, 100));
      const overall = round2(clamp(libraryContribution * 0.78 + structureContribution * 0.22 - input.dockingFit * 5 - input.overclaimRisk * 6 + (1 - input.parasiteSelectivity) * 8, 0, 100));
      return { mode: "naive_library_baseline", overall, dockingScore, libraryScore };
    }
    document.getElementById("run").onclick = () => {
      const input = {
        dockingFit: Number(document.getElementById("dock").value),
        libraryHitRate: Number(document.getElementById("library").value),
        pharmacophoreMatch: Number(document.getElementById("pharm").value),
        parasiteSelectivity: Number(document.getElementById("selectivity").value),
        evidenceStrength: 0.55,
        screenFollowThrough: 0.55,
        assayReadout: Number(document.getElementById("readout").value),
        overclaimRisk: 0.3,
        scoringBias: document.getElementById("bias").value,
      };
      const a = scoreStructure(input);
      const b = scoreLibrary(input);
      const winner = a.overall > b.overall + 0.5 ? "structure_based_dhodh" : b.overall > a.overall + 0.5 ? "naive_library_baseline" : "tie";
      document.getElementById("out").textContent =
        "Winner: " + winner + "\nStructure overall: " + a.overall + "\nLibrary overall: " + b.overall +
        "\nGap: " + round2(Math.abs(a.overall - b.overall)) +
        "\n\nSoft-sim approximate — use the Next app for dual-impl goldens.";
    };
  </script>
</body>
</html>
