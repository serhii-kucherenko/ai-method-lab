<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blood Loss Studio — offline try</title>
  <style>
    :root { --ink:#14181c; --teal:#1a6460; --chalk:#eef2f1; --amber:#a87a2e; }
    body { font-family: Georgia, serif; margin: 0; background: var(--chalk); color: var(--ink); }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.75rem; color: var(--teal); }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    button { margin-top: 1rem; background: var(--amber); color: #fff; border: 0; padding: 0.55rem 1rem; cursor: pointer; }
    .out { margin-top: 1.25rem; padding: 1rem; background: #fff; border: 1px solid #c5cbc9; }
    .fence { font-size: 0.8rem; color: #556; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Blood Loss Studio</h1>
    <p>Approximate offline demo: weighed_swab_measured vs haemoglobin_calculated soft-sim.</p>
    <label>Swab mass fidelity (0–1)
      <input id="swab" type="number" min="0" max="1" step="0.01" value="0.62" />
    </label>
    <label>HB delta coverage (0–1)
      <input id="hb" type="number" min="0" max="1" step="0.01" value="0.38" />
    </label>
    <label>Overclaim risk (0–1)
      <input id="risk" type="number" min="0" max="1" step="0.01" value="0.25" />
    </label>
    <button type="button" id="run">Compare</button>
    <div class="out" id="out">Run to see measured vs calculated soft-sim scores.</div>
    <p class="fence">Soft-sim only — not clinical advice, not EMR write-back, not device clearance. Full fidelity needs the local Next.js app.</p>
  </main>
  <script>
    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
    function round2(n) { return Math.round(n * 100) / 100; }
    function scoreMeasured(swab, hb, risk) {
      const overall = round2(clamp(swab * 72 + (1 - hb) * 18 - risk * 20 + 8, 0, 100));
      return overall;
    }
    function scoreCalculated(swab, hb, risk) {
      const overall = round2(clamp(hb * 68 + (1 - swab) * 16 - risk * 18 + 4, 0, 100));
      return overall;
    }
    document.getElementById("run").onclick = function () {
      const swab = Number(document.getElementById("swab").value);
      const hb = Number(document.getElementById("hb").value);
      const risk = Number(document.getElementById("risk").value);
      const m = scoreMeasured(swab, hb, risk);
      const c = scoreCalculated(swab, hb, risk);
      let winner = "tie";
      if (m > c + 0.5) winner = "weighed_swab_measured";
      else if (c > m + 0.5) winner = "haemoglobin_calculated";
      document.getElementById("out").innerHTML =
        "<strong>Winner:</strong> " + winner +
        "<br/>weighed_swab_measured: " + m +
        "<br/>haemoglobin_calculated: " + c +
        "<br/>gap: " + round2(Math.abs(m - c));
    };
  </script>
</body>
</html>
