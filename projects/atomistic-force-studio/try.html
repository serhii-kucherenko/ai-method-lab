<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atomistic Force Studio — offline demo</title>
    <style>
      :root {
        --ink: #121820;
        --teal: #2f7f8a;
        --mist: #eef2f4;
        --line: #c2c9ce;
        --amber: #c4923a;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--mist);
        color: var(--ink);
      }
      .hero {
        min-height: 70vh;
        padding: 3rem 1.5rem;
        background: linear-gradient(165deg, #0a1016 0%, #121820 48%, #1a242c 100%);
        color: #fff;
      }
      h1 {
        font-family: Sora, "Segoe UI", sans-serif;
        font-size: clamp(2rem, 5vw, 3.5rem);
        color: var(--teal);
        margin: 0;
      }
      .tag {
        font-family: Sora, "Segoe UI", sans-serif;
        font-size: 1.5rem;
        margin-top: 1rem;
      }
      .panel {
        max-width: 40rem;
        margin: -2rem auto 2rem;
        padding: 1.25rem;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.4rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
      }
      button {
        margin-top: 1rem;
        background: var(--teal);
        color: #fff;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.55rem 1rem;
        cursor: pointer;
      }
      .out {
        margin-top: 1rem;
        font-size: 0.95rem;
      }
      .fence {
        color: var(--amber);
        font-size: 0.85rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Atomistic Force Studio</h1>
      <p class="tag">Atomistic forces that earn a foundation model.</p>
      <p>Offline soft-sim: foundation-model atomistics vs classical force-field baseline.</p>
    </div>
    <div class="panel">
      <label>Pack coverage (0–1)
        <input id="packCoverage" type="number" step="0.01" value="0.62" />
      </label>
      <label>FM fidelity (0–1)
        <input id="fmFidelity" type="number" step="0.01" value="0.7" />
      </label>
      <label>Force clarity (0–1)
        <input id="forceClarity" type="number" step="0.01" value="0.74" />
      </label>
      <label>Classical FF rate (0–1)
        <input id="classicalFfRate" type="number" step="0.01" value="0.55" />
      </label>
      <button id="run">Score A vs B</button>
      <div class="out" id="out">Ready.</div>
      <p class="fence">
        Soft-sim only — not DFT-validated manufacturing, not live HPC, not the authors’ system.
      </p>
    </div>
    <script>
      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function scoreA(i) {
        const overall = round2(
          clamp(
            i.packCoverage * 40 +
              i.fmFidelity * 35 +
              i.forceClarity * 25 -
              i.classicalFfRate * 12 +
              8,
            0,
            100,
          ),
        );
        return overall;
      }
      function scoreB(i) {
        const overall = round2(
          clamp(
            i.classicalFfRate * 55 +
              (1 - i.fmFidelity) * 20 +
              i.forceClarity * 10,
            0,
            100,
          ),
        );
        return overall;
      }
      document.getElementById("run").onclick = function () {
        const i = {
          packCoverage: Number(document.getElementById("packCoverage").value),
          fmFidelity: Number(document.getElementById("fmFidelity").value),
          forceClarity: Number(document.getElementById("forceClarity").value),
          classicalFfRate: Number(document.getElementById("classicalFfRate").value),
        };
        const a = scoreA(i);
        const b = scoreB(i);
        const winner =
          a > b + 0.5
            ? "foundation_model_atomistics"
            : b > a + 0.5
              ? "classical_force_field_baseline"
              : "tie";
        document.getElementById("out").textContent =
          "A " + a + " · B " + b + " · winner " + winner + " (approx offline)";
      };
    </script>
  </body>
</html>
