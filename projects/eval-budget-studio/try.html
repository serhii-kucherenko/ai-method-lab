<!doctype html>
<meta charset="utf-8" />
<title>Eval Budget Studio</title>
<style>
  body { font: 16px Manrope, system-ui; background: #0f172a; color: #e2e8f0; max-width: 720px; margin: 10vh auto; }
  button { background: #34d399; border: 0; padding: 12px 16px; color: #0f172a; font-weight: 600; cursor: pointer; }
  strong { color: #34d399; }
</style>
<h1>Eval Budget Studio</h1>
<p>Forecast the bill before you burn it.</p>
<button onclick="run()">Compare paths</button>
<p id="result"></p>
<script>
function run() {
  const cap = 12, budget = 7, always = 21;
  result.innerHTML =
    "<strong>Budget-aware A: spend " + budget + "</strong> under cap " + cap + ".<br>" +
    "Always-max B: spend " + always + " — ignores the ceiling.";
}
</script>
