<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Margin Fusion Studio — offline try</title>
    <style>
      :root {
        --ink: #1a2228;
        --cyan: #2a8f9e;
        --gauze: #eef2f3;
        --rose: #b85a62;
        --line: #c3ced1;
      }
      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background: var(--gauze);
        color: var(--ink);
      }
      header {
        background: linear-gradient(165deg, #0f1519, #1a2228 48%, #1a3036);
        color: var(--gauze);
        padding: 2.5rem 1.5rem 3rem;
      }
      h1 {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 2rem;
        color: var(--cyan);
        margin: 0 0 0.5rem;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.5rem;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
      }
      button {
        margin-top: 1rem;
        background: var(--cyan);
        color: #fff;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.6rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .out {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      .note {
        font-size: 0.85rem;
        color: #4a5560;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Margin Fusion Studio</h1>
      <p>Offline soft-sim: marker-free deformable fusion vs marker-based.</p>
    </header>
    <main>
      <label
        >Deformable quality
        <input id="dq" type="number" min="0" max="1" step="0.01" value="0.65"
      /></label>
      <label
        >Surface fidelity
        <input id="sf" type="number" min="0" max="1" step="0.01" value="0.7"
      /></label>
      <label
        >Margin clarity
        <input id="mc" type="number" min="0" max="1" step="0.01" value="0.72"
      /></label>
      <label
        >Marker pass rate
        <input id="mp" type="number" min="0" max="1" step="0.01" value="0.8"
      /></label>
      <button id="go">Score A/B</button>
      <div class="out" id="out">Run a soft-sim compare.</div>
      <p class="note">
        Soft-sim only; not surgical device cleared; not live OR; not authors’
        system. arXiv 2607.13343.
      </p>
    </main>
    <script>
      function clamp(n, lo, hi) {
        return Math.max(lo, Math.min(hi, n));
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function scoreFree(i) {
        const load = clamp(i.hard * (1.25 - i.dq * 0.5), 0, 1.5);
        const def = clamp(
          (i.dq * 55 + i.sf * 25 - load * 10) * 1.12 + 8 - i.risk * 6,
          0,
          100,
        );
        const surf = clamp(i.sf * 60 * 1.12 + i.dq * 25 + 8 - i.opt * 4, 0, 100);
        const mar = clamp(
          i.mc * 58 * 1.12 + i.dq * 28 + 10 - load * 12 - i.risk * 10,
          0,
          100,
        );
        const stab = clamp(i.stab * 50 * 1.12 + i.sf * 25 + i.dq * 15 + 8, 0, 100);
        const free = clamp(
          def * 0.26 + surf * 0.24 + mar * 0.28 + stab * 0.22,
          0,
          100,
        );
        const mark = clamp(i.mp * 55 * 1.12 + i.opt * 20 - i.hard * 18 - 6, 0, 100);
        const based = clamp(mark * 0.7 + i.mp * 20 + i.opt * 10 - load * 12, 0, 100);
        return round2(free * 0.82 + based * 0.18 + 4);
      }
      function scoreBased(i) {
        const load = clamp(i.hard * (1.25 - i.dq * 0.5), 0, 1.5);
        const mark = clamp(
          i.mp * 58 * 1.08 * 1.35 + i.opt * 32 - i.hard * 10 + 8,
          0,
          100,
        );
        const based = clamp(mark * 0.55 + i.opt * 30 + i.mp * 20 - load * 8, 0, 100);
        const free = clamp(mark * 0.2 + based * 0.2, 0, 100);
        return round2(based * 0.78 + free * 0.22 - i.hard * 8 - i.risk * 6);
      }
      document.getElementById("go").onclick = () => {
        const i = {
          dq: Number(document.getElementById("dq").value),
          sf: Number(document.getElementById("sf").value),
          mc: Number(document.getElementById("mc").value),
          mp: Number(document.getElementById("mp").value),
          stab: 0.68,
          opt: 0.55,
          hard: 0.35,
          risk: 0.25,
        };
        const a = scoreFree(i);
        const b = scoreBased(i);
        const winner =
          a > b + 0.5 ? "marker_free" : b > a + 0.5 ? "marker_based" : "tie";
        document.getElementById("out").textContent =
          "A marker-free " +
          a +
          " · B marker-based " +
          b +
          " · winner " +
          winner +
          " · gap " +
          round2(Math.abs(a - b));
      };
    </script>
  </body>
</html>
